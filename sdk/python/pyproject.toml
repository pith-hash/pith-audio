[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pith-audio"
version = "0.1.0"
description = "Audio fingerprinting SDK: RIFF/WAVE decode, spectral-peak signatures and delta-t matching via the pith-audio Rust cdylib (ctypes, zero-dep)"
license = "MIT"
requires-python = ">=3.9"
keywords = ["audio", "wav", "fingerprinting", "decoder", "pcm", "hashing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Repository = "https://github.com/pith-hash/pith-audio"
Homepage = "https://github.com/pith-hash/pith-audio"

[tool.setuptools]
packages = ["pith_audio"]

[tool.setuptools.package-data]
pith_audio = ["*.dll", "*.dylib", "*.so"]
