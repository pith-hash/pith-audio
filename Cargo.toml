[package]
name = "pith-audio"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/pith-hash/pith-audio"
homepage = "https://github.com/pith-hash/pith-audio"
description = "Audio fingerprinting: RIFF/WAVE and FLAC decode, Shazam-style spectral-peak signatures and delta-t histogram matching"
readme = "README.md"
categories = ["algorithms", "cryptography"]
keywords = ["audio", "wav", "fingerprinting", "pcm", "hashing"]

[lib]
# The cdylib is the binary every language SDK binds through (ctypes,
# koffi, cgo); the rlib keeps the Rust consumers unchanged.
crate-type = ["cdylib", "rlib"]

[features]
# Default-on: the cdylib needs std for its panic handler. The library
# itself stays no_std-compatible (`--no-default-features` still builds).
default = ["std"]
std = []

[dependencies]
pith-digest = { version = "0.1", git = "https://github.com/pith-hash/pith-digest.git", branch = "main" }
pith-flac = { version = "0.1", git = "https://github.com/pith-hash/pith-flac.git", branch = "main" }
pith-math = { version = "0.1", git = "https://github.com/pith-hash/pith-math.git", branch = "main" }

# Vector generator: regenerates reference.json (CI verifies it is current,
# CD ships it with the SDK artifacts).
[[bin]]
name = "gen-reference"
path = "tools/gen-reference/main.rs"

# `unsafe_code` is denied at the crate root (`#![deny(unsafe_code)]` in
# src/lib.rs), with the single `#![allow(unsafe_code)]` confined to
# src/ffi.rs, the C ABI surface. It cannot live here: `[lints]` entries
# become command-line flags, and command-line lints cannot be
# re-allowed by inner attributes.
[lints.rust]
missing_docs = "deny"
